    <div class="container"><div class="form-container">
        <h1 class="text-center">🔐 एडमिन लॉगिन</h1>
        <p class="text-center mb-3">केवल अधिकृत</p>
        <!-- लॉक क्रेडेंशियल्स अब यहाँ दिखाई नहीं देंगे - उन्हें firebase.js में रखा गया है -->
        <form id="loginForm">
            <div class="form-group"><label class="form-label">यूज़रनेम</label><input type="text" class="form-control" id="username" required></div>
            <div class="form-group"><label class="form-label">पासवर्ड</label><input type="password" class="form-control" id="password" required></div>
            <div class="form-group"><label class="form-label">Owner ID</label><input type="text" class="form-control" id="ownerId" required></div>
            <div class="form-group"><label class="form-label">Owner Key</label><input type="password" class="form-control" id="ownerKey" required></div>
            <button type="submit" class="btn btn-primary" style="width:100%;">लॉगिन करें</button>
        </form>
        <div id="msg" class="message" style="margin-top:1rem; display:none;"></div>
    </div></div>
    <div style="position:fixed; bottom:10px; right:10px;"><button onclick="testFirebaseConnection().then(r=>alert(r.message))" style="background:var(--primary); color:white; border:none; padding:10px 15px; border-radius:50px;">🔌 Test</button></div>
    <footer><div class="container"><p>&copy; 2024 Aarish Tiles Network</p><p><strong>अरिश खान</strong> - 8755687268</p></div></footer>
    <script>
        function toggleMenu(){document.getElementById('navMenu').classList.toggle('active');}
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', (e)=>{
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const ownerId = document.getElementById('ownerId').value;
            const ownerKey = document.getElementById('ownerKey').value;
            const result = window.adminLogin(username, password, ownerId, ownerKey);
            if(result.success) window.location.href = 'admin-panel.html';
            else{
                const msgDiv = document.getElementById('msg');
                msgDiv.textContent = result.message;
                msgDiv.className = 'message error';
                msgDiv.style.display = 'block';
                setTimeout(()=>msgDiv.style.display='none',3000);
            }
        });
    </script>
</body>
</html>
