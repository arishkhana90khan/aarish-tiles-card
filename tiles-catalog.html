    <div class="container">
        <h1 class="text-center mt-3">🧱 हमारे टाइल्स</h1>
        <p class="text-center">बेहतरीन क्वालिटी, किफायती दाम।</p>
        <div id="tilesGrid" class="card-grid"></div>
    </div>
    <div style="position:fixed; bottom:10px; right:10px;"><button onclick="testFirebaseConnection().then(r=>alert(r.message))" style="background:var(--primary); color:white; border:none; padding:10px 15px; border-radius:50px;">🔌 Test</button></div>
    <footer><div class="container"><p>&copy; 2024 Aarish Tiles Network</p><p><strong>अरिश खान</strong> - 8755687268</p></div></footer>
    <script>
        function toggleMenu(){document.getElementById('navMenu').classList.toggle('active');}
        async function loadTiles(){
            const container = document.getElementById('tilesGrid');
            container.innerHTML = '<div class="text-center">⏳ लोड हो रहा...</div>';
            try{
                const snap = await db.collection('tiles').orderBy('createdAt','desc').get();
                if(snap.empty){ container.innerHTML = '<div class="text-center">❌ अभी कोई टाइल नहीं है।</div>'; return; }
                let html = '';
                snap.forEach(doc=>{
                    const t = doc.data();
                    html += `<div class="card"><div class="tile-image">${t.imageIcon || '🧱'}</div><div class="card-content">
                    <h3>${t.name}</h3><p class="tile-size">साइज़: ${t.size}</p><p class="tile-price">₹${t.price}/वर्ग फुट</p>
                    <div class="review-section"><div class="rating">★★★★☆ (${t.reviewCount||0} रिव्यू)</div>
                    <input type="text" class="review-input" id="rev_${doc.id}" placeholder="अपनी राय लिखें...">
                    <button class="btn btn-outline" style="width:100%; margin-top:0.5rem;" onclick="addReview('${doc.id}','${t.name}')">📝 रिव्यू दें</button></div>
                    <button class="whatsapp-btn" style="margin-top:1rem;" onclick="whatsappOwner('${t.name} ऑर्डर करना है')">📱 WhatsApp ऑर्डर</button>
                    </div></div>`;
                });
                container.innerHTML = html;
            }catch(e){ container.innerHTML = '<div class="text-center">❌ त्रुटि: '+e.message+'</div>'; }
        }
        window.addReview = async (tileId, tileName)=>{
            const comment = document.getElementById(`rev_${tileId}`).value.trim();
            if(!comment){ alert('कृपया रिव्यू लिखें'); return; }
            try{
                await db.collection('reviews').add({
                    tileId, tileName, comment,
                    rating: 4,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert('धन्यवाद! रिव्यू भेज दिया गया।');
                document.getElementById(`rev_${tileId}`).value = '';
            }catch(e){ alert('त्रुटि: '+e.message); }
        };
        window.addEventListener('load', loadTiles);
    </script>
</body>
